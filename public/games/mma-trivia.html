<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMA Trivia Challenge</title>
    <style>
        :root {
            --bg: #09090d;
            --surface: #111118;
            --surface2: #1a1a24;
            --border: #2a2a38;
            --text: #f0f0f0;
            --muted: #888;
            --gold: #d4a017;
            --red: #e8372a;
            --green: #27ae60;
            --font: 'Barlow Condensed', sans-serif;
            --display: 'Bebas Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 16px;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .logo {
            font-family: var(--display);
            font-size: 2.8rem;
            color: var(--gold);
            letter-spacing: 4px;
        }

        .logo-sub {
            font-size: 1rem;
            color: var(--muted);
        }

        .logo-stats {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: -8px;
        }

        .btn {
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all .15s;
            min-height: 44px;
            width: 100%;
        }

        .btn-red {
            background: var(--red);
            color: #fff;
        }

        .btn-red:hover {
            background: #ff4535;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .hud-label {
            font-size: .6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .hud-value {
            font-family: var(--display);
            font-size: 1.2rem;
            color: var(--gold);
        }

        .timer-wrap {
            width: 100%;
            height: 5px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .timer-bar {
            height: 100%;
            background: var(--gold);
            border-radius: 3px;
            transition: width .2s linear, background .5s;
        }

        .prize-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .prize-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface2);
            font-size: .55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-weight: 700;
        }

        .prize-dot.done {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        .prize-dot.current {
            border-color: var(--gold);
            color: var(--gold);
        }

        .prize-dot.wrong {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }

        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            flex-shrink: 0;
        }

        .q-num {
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .q-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .q-category {
            font-size: .65rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .ans-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 10px;
            font-family: var(--font);
            font-size: .95rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all .15s;
            min-height: 52px;
            line-height: 1.3;
            touch-action: manipulation;
        }

        .ans-btn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .ans-btn.correct {
            background: rgba(39, 174, 96, .2);
            border-color: var(--green);
            color: var(--green);
        }

        .ans-btn.wrong {
            background: rgba(232, 55, 42, .2);
            border-color: var(--red);
            color: var(--red);
        }

        .lifelines {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .life-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            font-family: var(--font);
            font-size: .78rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all .15s;
            min-height: 36px;
        }

        .life-btn:hover:not(.used) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .life-btn.used {
            opacity: .3;
            cursor: not-allowed;
        }

        .result-icon {
            font-size: 3.5rem;
        }

        .result-title {
            font-family: var(--display);
            font-size: 2.2rem;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .result-score {
            font-size: 1.1rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .stat-val {
            font-family: var(--display);
            font-size: 1.4rem;
            color: var(--text);
        }

        .cat-filter {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-family: var(--font);
            font-size: .75rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            transition: all .15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cat-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 160, 23, .1);
        }

        .difficulty-badge {
            font-size: .6rem;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            display: inline-block;
            margin-left: 6px;
        }

        .diff-easy {
            background: rgba(39, 174, 96, .2);
            color: var(--green);
        }

        .diff-medium {
            background: rgba(212, 160, 23, .2);
            color: var(--gold);
        }

        .diff-hard {
            background: rgba(232, 55, 42, .2);
            color: var(--red);
        }

        @media(max-width:400px) {
            .answers {
                grid-template-columns: 1fr;
            }

            .ans-btn {
                min-height: 44px;
            }

            .logo {
                font-size: 2rem;
            }
        }

        @media(max-height:600px) {
            .prize-bar {
                display: none;
            }

            .q-card {
                padding: 12px;
            }

            .q-text {
                font-size: 1rem;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <div class="screen active" id="screen-start">
            <div class="logo">🧠 MMA TRIVIA</div>
            <div class="logo-sub">15 random questions · 3 lifelines · 30 seconds per question</div>
            <div class="logo-stats" id="pool-info">Pool: 60+ questions</div>
            <div class="cat-filter" id="cat-filter"></div>
            <button class="btn btn-red" id="btn-start">Start Game</button>
        </div>

        <div class="screen" id="screen-game">
            <div class="hud">
                <div class="hud-item"><span class="hud-label">Question</span><span class="hud-value"
                        id="h-q">1/15</span>
                </div>
                <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="h-score">0</span>
                </div>
                <div class="hud-item"><span class="hud-label">Streak</span><span class="hud-value"
                        id="h-streak">0🔥</span></div>
                <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="h-time">30</span>
                </div>
            </div>
            <div class="timer-wrap">
                <div class="timer-bar" id="timer-bar" style="width:100%"></div>
            </div>
            <div class="prize-bar" id="prize-bar"></div>
            <div class="q-card">
                <div class="q-num" id="q-num">Question 1</div>
                <div class="q-text" id="q-text">...</div>
                <div class="q-category" id="q-cat"></div>
            </div>
            <div class="answers" id="answers"></div>
            <div class="lifelines">
                <button class="life-btn" id="ll-50">50/50</button>
                <button class="life-btn" id="ll-skip">⏭ Skip</button>
                <button class="life-btn" id="ll-time">⏱ +15 sec</button>
            </div>
        </div>

        <div class="screen" id="screen-result">
            <div class="result-icon" id="r-icon">🏆</div>
            <div class="result-title" id="r-title">RESULT</div>
            <div class="result-score" id="r-score">Score: 0</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Correct</div>
                    <div class="stat-val" id="r-correct">0/15</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Max Streak</div>
                    <div class="stat-val" id="r-streak">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-val" id="r-acc">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Grade</div>
                    <div class="stat-val" id="r-grade">—</div>
                </div>
            </div>
            <button class="btn btn-red" id="btn-restart">Play Again</button>
            <button class="btn btn-outline" id="btn-menu">Main Menu</button>
        </div>
    </div>

    <script>
        // =========================================================
        // QUESTION BANK — 63 verified questions

        // diff: easy | medium | hard
        // =========================================================
        const ALL_Q = [
            // === HISTORY ===

            { q: "Who won the first UFC 1 tournament?", a: ["Rorion Gracie", "Royce Gracie", "Ken Shamrock", "Patrick Smith"], c: 1, cat: "Champions", diff: "easy" },
            { q: "Who became the first UFC heavyweight champion?", a: ["Bas Rutten", "Randy Couture", "Mark Coleman", "Tito Ortiz"], c: 2, cat: "Champions", diff: "medium" },

            { q: "What is 'ground and pound'?", a: ["Punching while standing", "Striking a grounded opponent from the top", "A takedown slam", "An arm submission"], c: 1, cat: "Technique", diff: "easy" },
            { q: "The triangle choke comes from which martial art?", a: ["Boxing", "Muay Thai", "Brazilian jiu-jitsu", "Kickboxing"], c: 2, cat: "Technique", diff: "easy" },
            { q: "What is a 'rear naked choke' (RNC)?", a: ["An arm lock", "A choke from the back using the arms", "A front choke", "Scissor choke"], c: 1, cat: "Technique", diff: "easy" },

            // === POP CULTURE / MISC ===
            { q: "The UFC show 'The Ultimate Fighter' helped save the organization from bankruptcy. When did season 1 air?", a: ["2003", "2005", "2007", "2009"], c: 1, cat: "History", diff: "medium" },
            { q: "Who has commented on most UFC main cards since 1997?", a: ["Mike Goldberg", "Joe Rogan", "Daniel Cormier", "Bruce Buffer"], c: 1, cat: "History", diff: "easy" },
            { q: "The legendary Forrest Griffin vs. Stephan Bonnar fight on TUF 1 helped do what?", a: ["Bring UFC to Russia", "Save UFC from bankruptcy", "Launch the women's division", "Introduce 5-round title fights"], c: 1, cat: "History", diff: "medium" },
        ];

        const PRIZES = [100, 200, 300, 500, 750, 1000, 1500, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 50000];
        const CATEGORIES = [...new Set(ALL_Q.map(q => q.cat))];

        let selectedCats = new Set(CATEGORIES);
        let gameQuestions = [];
        let qi = 0, score = 0, streak = 0, maxStreak = 0, correct = 0, timeLeft = 30, timerInt = null, answering = false;

        function buildCatFilter() {
            const cf = document.getElementById('cat-filter');
            cf.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn active';
            allBtn.textContent = 'All';
            allBtn.dataset.cat = '__all__';
            allBtn.addEventListener('click', () => {
                if (selectedCats.size === CATEGORIES.length) return;
                selectedCats = new Set(CATEGORIES);
                updateCatUI();
            });
            cf.appendChild(allBtn);

            CATEGORIES.forEach(cat => {
                const b = document.createElement('button');
                b.className = 'cat-btn active';
                b.textContent = cat;
                b.dataset.cat = cat;
                b.addEventListener('click', () => {
                    if (selectedCats.has(cat)) {
                        if (selectedCats.size <= 1) return;
                        selectedCats.delete(cat);
                    } else {
                        selectedCats.add(cat);
                    }
                    updateCatUI();
                });
                cf.appendChild(b);
            });

            updatePoolInfo();
        }

        function updateCatUI() {
            document.querySelectorAll('.cat-btn').forEach(b => {
                if (b.dataset.cat === '__all__') {
                    b.classList.toggle('active', selectedCats.size === CATEGORIES.length);
                } else {
                    b.classList.toggle('active', selectedCats.has(b.dataset.cat));
                }
            });
            updatePoolInfo();
        }

        function updatePoolInfo() {
            const pool = ALL_Q.filter(q => selectedCats.has(q.cat));
            document.getElementById('pool-info').textContent = `Pool: ${pool.length} questions · ${selectedCats.size} categories selected`;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickQuestions() {
            const pool = ALL_Q.filter(q => selectedCats.has(q.cat));
            return shuffle(pool).slice(0, 15);
        }

        function buildPrize() {
            const pb = document.getElementById('prize-bar');
            pb.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const d = document.createElement('div');
                d.className = 'prize-dot';
                d.id = 'pd-' + i;
                d.textContent = PRIZES[i] >= 1000 ? PRIZES[i] / 1000 + 'K' : PRIZES[i];
                pb.appendChild(d);
            }
        }

        function updatePrize(s) {
            for (let i = 0; i < 15; i++) {
                const d = document.getElementById('pd-' + i);
                if (!d) continue;
                d.className = 'prize-dot';
                if (i < qi) d.classList.add('done');
                else if (i === qi) d.classList.add(s === 'wrong' ? 'wrong' : 'current');
            }
        }

        function getDiffBadge(diff) {
            const map = { easy: ['easy', 'Easy'], medium: ['medium', 'Medium'], hard: ['hard', 'Hard'] };
            const [cls, label] = map[diff] || ['easy', ''];
            return `<span class="difficulty-badge diff-${cls}">${label}</span>`;
        }

        function loadQ() {
            if (qi >= gameQuestions.length) { endGame(); return; }
            const q = gameQuestions[qi];
            answering = false;
            document.getElementById('q-num').innerHTML = `Question ${qi + 1}/15 ${getDiffBadge(q.diff)}`;
            document.getElementById('q-text').textContent = q.q;
            document.getElementById('q-cat').textContent = '📁 ' + q.cat;
            document.getElementById('h-q').textContent = `${qi + 1}/15`;
            updatePrize('');
            const ans = document.getElementById('answers');
            ans.innerHTML = '';
            q.a.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'ans-btn';
                b.textContent = opt;
                b.addEventListener('click', () => answer(i));
                ans.appendChild(b);
            });
            document.getElementById('ll-50').classList.remove('used');
            document.getElementById('ll-skip').classList.remove('used');
            document.getElementById('ll-time').classList.remove('used');
            startTimer(30);
        }

        function startTimer(s) {
            clearInterval(timerInt);
            timeLeft = s;
            document.getElementById('h-time').textContent = s;
            document.getElementById('timer-bar').style.width = '100%';
            timerInt = setInterval(() => {
                timeLeft--;
                document.getElementById('h-time').textContent = timeLeft;
                document.getElementById('timer-bar').style.width = (timeLeft / s * 100) + '%';
                document.getElementById('timer-bar').style.background = timeLeft > 15 ? '#d4a017' : timeLeft > 7 ? '#e67e22' : '#c0392b';
                if (timeLeft <= 0) { clearInterval(timerInt); timeout(); }
            }, 1000);
        }

        function timeout() {
            if (answering) return;
            answering = true;
            streak = 0;
            document.getElementById('h-streak').textContent = '0🔥';
            document.querySelectorAll('.ans-btn')[gameQuestions[qi].c].classList.add('correct');
            updatePrize('wrong');
            setTimeout(() => { qi++; loadQ(); }, 1500);
        }

        function answer(i) {
            if (answering) return;
            answering = true;
            clearInterval(timerInt);
            const q = gameQuestions[qi];
            const btns = document.querySelectorAll('.ans-btn');
            if (i === q.c) {
                btns[i].classList.add('correct');
                correct++;
                streak++;
                maxStreak = Math.max(maxStreak, streak);
                score += PRIZES[qi] + (streak >= 3 ? Math.floor(PRIZES[qi] * .2) : 0);
                document.getElementById('h-score').textContent = score;
                document.getElementById('h-streak').textContent = streak + '🔥';
                updatePrize('done');
                setTimeout(() => { qi++; loadQ(); }, 900);
            } else {
                btns[i].classList.add('wrong');
                btns[q.c].classList.add('correct');
                streak = 0;
                document.getElementById('h-streak').textContent = '0🔥';
                updatePrize('wrong');
                setTimeout(() => { qi++; loadQ(); }, 1500);
            }
        }

        function endGame() {
            clearInterval(timerInt);
            const acc = Math.round(correct / 15 * 100);
            const grade = correct >= 13 ? '🥇 S' : correct >= 10 ? '🥈 A' : correct >= 7 ? '🥉 B' : correct >= 4 ? '💪 C' : '📚 D';
            document.getElementById('r-icon').textContent = correct >= 10 ? '🏆' : correct >= 7 ? '😤' : '📚';
            document.getElementById('r-title').textContent = correct >= 13 ? 'LEGEND!' : correct >= 10 ? 'CHAMPION!' : correct >= 7 ? 'CONTENDER' : 'KEEP GOING!';
            document.getElementById('r-score').textContent = 'Score: ' + score.toLocaleString();
            document.getElementById('r-correct').textContent = correct + '/15';
            document.getElementById('r-streak').textContent = maxStreak;
            document.getElementById('r-acc').textContent = acc + '%';
            document.getElementById('r-grade').textContent = grade;
            show('screen-result');
        }

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            gameQuestions = pickQuestions();
            if (gameQuestions.length < 15) {
                alert('Not enough questions in the selected categories! Please choose more categories.');
                return;
            }
            qi = 0; score = 0; streak = 0; maxStreak = 0; correct = 0;
            document.getElementById('h-score').textContent = '0';
            document.getElementById('h-streak').textContent = '0🔥';
            buildPrize();
            show('screen-game');
            loadQ();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            gameQuestions = pickQuestions();
            qi = 0; score = 0; streak = 0; maxStreak = 0; correct = 0;
            document.getElementById('h-score').textContent = '0';
            document.getElementById('h-streak').textContent = '0🔥';
            buildPrize();
            show('screen-game');
            loadQ();
        });

        document.getElementById('btn-menu').addEventListener('click', () => show('screen-start'));

        document.getElementById('ll-50').addEventListener('click', function () {
            if (this.classList.contains('used') || answering) return;
            this.classList.add('used');
            const btns = document.querySelectorAll('.ans-btn');
            let h = 0;
            for (let i = 0; i < 4; i++) {
                if (i !== gameQuestions[qi].c && h < 2) {
                    btns[i].style.opacity = '.2';
                    btns[i].disabled = true;
                    h++;
                }
            }
        });

        document.getElementById('ll-skip').addEventListener('click', function () {
            if (this.classList.contains('used') || answering) return;
            this.classList.add('used');
            answering = true;
            clearInterval(timerInt);
            setTimeout(() => { answering = false; qi++; loadQ(); }, 300);
        });

        document.getElementById('ll-time').addEventListener('click', function () {
            if (this.classList.contains('used')) return;
            this.classList.add('used');
            timeLeft += 15;
            document.getElementById('h-time').textContent = timeLeft;
        });

        buildCatFilter();
    </script>
</body>

</html>
